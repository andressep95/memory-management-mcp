spring:
  application:
    name: memory-management-mcp

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.oracle.autoconfigure.OracleVectorStoreAutoConfiguration

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: mcp_user
    password: Mcp_User23!
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: false

  codec:
    max-in-memory-size: 10MB

  ai:
    mcp:
      server:
        name: memory-management-mcp
        version: 0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health

# ── Enrichment Pipeline (LLM-based commit field inference) ──
enrichment:
  enabled: true
  llm:
    provider: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      base-url: https://api.openai.com/v1
